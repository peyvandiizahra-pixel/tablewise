[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablewise"
version = "0.1.0"
description = "From messy tables to trusted answers, dashboards and alerts, with a person approving every step."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zahra Payvandi" }]
dependencies = [
  "pandas>=2.1,<3",
  "numpy",
  "duckdb>=1.1",
  "anthropic>=2.10",
  "gradio>=5",
  "plotly",
  "graphviz",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery[pandas]>=3.20", "db-dtypes"]
dev = ["pytest"]

[project.scripts]
tablewise = "tablewise.cli:main"

[tool.setuptools]
packages = ["tablewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
